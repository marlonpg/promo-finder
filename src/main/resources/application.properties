spring.application.name=promo-finder

# Secrets (SMTP password, Telegram token, Twilio keys) go in application-local.properties (gitignored),
# in the project root or in src/main/resources, or in environment variables,
# e.g. PROMO_NOTIFICATION_TELEGRAM_BOT_TOKEN.
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

server.port=8080

spring.datasource.url=jdbc:h2:file:./data/promofinder;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.messages.fallback-to-system-locale=false
spring.h2.console.enabled=true

# --- Claude Code CLI ---
# Executable to run. On Windows "claude" resolves to claude.exe; point to claude.cmd if you installed via npm only.
promo.claude.command=claude
promo.claude.model=haiku
promo.claude.timeout=10m
# Empty directory Claude runs in, so it doesn't pick up any project CLAUDE.md
promo.claude.work-dir=./data/claude-work

# --- Scheduler ---
# How often the scheduler looks for watches that are due. Each watch has its own interval.
promo.scheduler.tick=1m

# --- Notifications (leave blank to disable a channel) ---
promo.notification.email.from=
promo.notification.email.to=
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=you@gmail.com
# spring.mail.password=app-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

promo.notification.telegram.bot-token=
promo.notification.telegram.chat-id=

promo.notification.sms.twilio-account-sid=
promo.notification.sms.twilio-auth-token=
promo.notification.sms.from=
promo.notification.sms.to=
